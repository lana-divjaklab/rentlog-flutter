include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - lib/**/*.g.dart
    - lib/**/*.freezed.dart
    - lib/l10n/gen/**
    - build/**
    - android/**
    - ios/**
  errors:
    # json_serializable annotations on freezed constructor params.
    invalid_annotation_target: ignore

linter:
  rules:
    public_member_api_docs: false
    lines_longer_than_80_chars: false
    # Wants Dart's new `new(...)` constructor syntax; keep the familiar form.
    unnecessary_type_name_in_constructor: false
    # Models list fields in the order Convex returns them.
    always_put_required_named_parameters_first: false
