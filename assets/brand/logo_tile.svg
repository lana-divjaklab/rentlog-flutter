<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- RentLOG mark: a chevron roof over three ledger lines.
       Geometry matches the mobile app icon (rent_log_flutter/tool/gen_branding.dart)
       and src/components/brand/Logo.tsx. -->
  <defs>
    <linearGradient id="rl-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1119"/>
      <stop offset="1" stop-color="#16222e"/>
    </linearGradient>
    <linearGradient id="rl-mark" gradientUnits="userSpaceOnUse" x1="0" y1="17" x2="0" y2="88">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="24" fill="url(#rl-tile)"/>

  <g transform="translate(19 19) scale(0.62)"
     stroke="url(#rl-mark)" stroke-linecap="round" fill="none">
    <path d="M18 41 L50 17 L82 41" stroke-width="11" stroke-linejoin="round"/>
    <path d="M26.5 55 H73.5" stroke-width="9"/>
    <path d="M26.5 69 H73.5" stroke-width="9"/>
    <path d="M37.5 83 H62.5" stroke-width="9"/>
  </g>
</svg>
